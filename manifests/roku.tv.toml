[driver]
id = "roku.tv"
name = "Roku TV"
manufacturer = "Roku"
version = "1.0.0"
runtime = "native"
primary = true

# Two proxies, because a Roku TV genuinely is two things: a streamer and a display. A room's
# "watch Netflix" goes to the media_player; its volume goes to the tv.
[[proxy]]
id = 1
type = "media_player"
primary = true
name = "Roku"
capabilities = { has_transport = true, has_skip = true, has_scan = true, has_dpad = true, has_apps = true, has_deep_link = true, has_search = true, is_video_source = true, is_audio_source = true }

[[proxy]]
id = 2
type = "tv"
name = "Screen"
capabilities = { has_discrete_power = true, has_discrete_input = true, has_volume = true, warmup_ms = 2000 }

[[connection]]
id = 1001
proxy = 2
dir = "consumer"
class = "HDMI"
name = "HDMI 1"

[[connection]]
id = 1002
proxy = 2
dir = "consumer"
class = "HDMI"
name = "HDMI 2"

[[transport]]
kind = "network"
port = 8060
discovery = "ssdp"

[[property]]
name = "Address"
type = "string"
tooltip = "IP address of the Roku"

[[property]]
name = "Port"
type = "ranged_int"
min = 1
max = 65535
default = 8060
tooltip = "ECP port. 8060 unless you have changed it."

[discovery]
ssdp = ["roku:ecp"]
mac_oui = ["B0:A7:37", "CC:6D:A0", "D8:31:34"]
