[driver]
# `roku.player` rather than a bare `roku`: an id namespaces a product under its vendor, and
# a bare one would take the whole `roku` namespace for a single driver. What anybody sees is
# `name`.
id = "roku.player"
name = "Roku"
manufacturer = "Roku"
version = "1.0.0"
runtime = "wasm"
# The sibling `roku.tv` leads with this one — see `DriverDecl::primary`. Discovery is declared
# here and only here: both are the same ECP on the same port, so a manifest each claiming
# `roku:ecp` would offer two rows for one television and ask whoever is adding it a question
# the device can answer. Setup asks it instead — `is-tv` in `/query/device-info` — and hands
# back whichever id fits, the same way `apple.tv` hands back `apple.tv.ir`.
primary = true

# A streamer with no screen of its own: a Streaming Stick, an Express, an Ultra. Volume,
# power and inputs belong to whatever it is plugged into, which is a different device.
[[proxy]]
id = 1
type = "media_player"
primary = true
name = "Roku Home"
capabilities = { has_transport = true, has_skip = true, has_scan = true, has_dpad = true, has_apps = true, has_app_launcher = true, has_deep_link = true, has_search = true, is_video_source = true, is_audio_source = true }

# No port here — the `Port` property below carries it, defaulting to 8060, and core reads
# that first when it resolves this driver's relative URLs.
[[transport]]
kind = "network"

[[property]]
name = "Address"
type = "string"
tooltip = "IP address of the Roku"

[[property]]
name = "Port"
type = "ranged_int"
min = 1
max = 65535
default = 8060
tooltip = "ECP port. 8060 unless you have changed it."

[discovery]
ssdp = ["roku:ecp"]
mac_oui = ["B0:A7:37", "CC:6D:A0", "D8:31:34"]
